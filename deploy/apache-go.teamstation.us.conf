<VirtualHost *:80>
    ServerName go.teamstation.us
    ServerAdmin ops@teamstation.us

    DocumentRoot /var/www/teamstation-link-shortener/public

    <Directory /var/www/teamstation-link-shortener/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/go.teamstation.us-error.log
    CustomLog ${APACHE_LOG_DIR}/go.teamstation.us-access.log combined
</VirtualHost>
